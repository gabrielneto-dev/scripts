# dev-environment-kit — configuração tmux personalizada

# Terminal, cores verdadeiras e teclas estendidas
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm*:RGB:extkeys:clipboard"
set -s extended-keys on
set -s escape-time 0
set -g focus-events on

# Prefixo familiar: Ctrl+b
unbind C-b
set -g prefix C-b
bind C-b send-prefix

# Comportamento geral
set -g mouse on
set -g history-limit 30000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g mode-keys vi
setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# Alertas sem piscar a tela
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# Título do terminal
set -g set-titles on
set -g set-titles-string '#H · #S:#I:#W#{?client_prefix, · PREFIX,}'

# Novas janelas e painéis preservam o diretório atual
bind c new-window -c "#{pane_current_path}"
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"

# Navegação e redimensionamento no estilo Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# Seleção vi e clipboard automático: WSL, Wayland, X11 ou OSC 52
set -g set-clipboard on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-copy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-copy"

# Recarregar configuração
bind r source-file "$HOME/.tmux.conf" \; display-message "Configuração recarregada"

# Popups e seletor
bind C-l display-popup -E -w 85% -h 75% "$HOME/.local/bin/tmux-switcher"
bind C-n display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$HOME/.local/bin/tmux-notes"
bind C-h display-popup -E -w 85% -h 85% "htop"
bind C-t display-popup -E -w 85% -h 80% -d "#{pane_current_path}"

# Barra ciano e preto
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 120
set -g status-style "fg=colour16,bg=colour51"
set -g status-left '#[fg=colour51,bg=colour16,bold] #h · #S #[fg=colour16,bg=colour51]'
set -g status-right '#[fg=colour51,bg=colour16]#[fg=white,bg=colour16] #(test -n "$SSH_CONNECTION" && printf "SSH · ")%d/%m · %H:%M '
setw -g window-status-separator ""
setw -g window-status-style "fg=colour16,bg=colour51"
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-style "fg=white,bg=colour16,bold"
setw -g window-status-current-format '#[fg=colour51,bg=colour16] #I:#W#F #[fg=colour16,bg=colour51]'
setw -g window-status-activity-style "fg=colour196,bg=colour51,bold"
set -g pane-border-style "fg=colour24"
set -g pane-active-border-style "fg=colour51"
set -g mode-style "fg=colour51,bg=colour16,bold"
set -g message-style "fg=colour51,bg=colour16"
set -g message-command-style "fg=colour51,bg=colour16"

# TPM e persistência automática
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run-shell "$HOME/.tmux/plugins/tpm/tpm"

